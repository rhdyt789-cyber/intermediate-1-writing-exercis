
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opinion Essay Builder - Reality TV</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1,h2{
    color:#2c3e50;
}

.essay-box{
    background:#eef5ff;
    padding:20px;
    border-left:5px solid #3498db;
    border-radius:8px;
    margin-bottom:25px;
}

.question{
    margin-bottom:15px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

textarea{
    min-height:90px;
}

button{
    background:#3498db;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:#2980b9;
}

.result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
}

.generated{
    margin-top:20px;
    background:#fafafa;
    border:1px solid #ddd;
    padding:20px;
    border-radius:8px;
    white-space:pre-wrap;
}

.feedback{
    margin-top:20px;
    background:#f8f9fa;
    padding:15px;
    border-radius:8px;
}
</style>
</head>
<body>

<div class="container">

<h1>Reality TV Opinion Essay Builder</h1>

<h2>Part A: Reading Comprehension</h2>

<div class="question">
1. Name one type of reality TV programme.
<input type="text" id="q1">
</div>

<div class="question">
2. What is one advantage of reality TV?
<input type="text" id="q2">
</div>

<div class="question">
3. What is one disadvantage of reality TV?
<input type="text" id="q3">
</div>

<div class="question">
4. Does the writer support reality TV?
<input type="text" id="q4">
</div>

<button onclick="checkReading()">Check Answers</button>

<div class="result" id="readingScore"></div>

<hr>

<h2>Part B: Build Your Own Opinion Essay</h2>

<label>Essay Topic</label>
<input type="text" id="topic"
placeholder="Example: Social Media is Useful for Students">

<label>Argument 1 (Advantage)</label>
<textarea id="adv1"></textarea>

<label>Argument 2 (Advantage)</label>
<textarea id="adv2"></textarea>

<label>Counterargument (Disadvantage)</label>
<textarea id="disadv"></textarea>

<label>Your Final Opinion</label>
<textarea id="conclusion"></textarea>

<button onclick="generateEssay()">Generate My Essay</button>

<div id="essayOutput"></div>

</div>

<script>

function checkReading(){

let score = 0;

let q1 = document.getElementById("q1").value.toLowerCase();
let q2 = document.getElementById("q2").value.toLowerCase();
let q3 = document.getElementById("q3").value.toLowerCase();
let q4 = document.getElementById("q4").value.toLowerCase();

if(
q1.includes("singing") ||
q1.includes("cooking") ||
q1.includes("travel")
){
score++;
}

if(
q2.includes("variety") ||
q2.includes("famous") ||
q2.includes("experience")
){
score++;
}

if(
q3.includes("boring") ||
q3.includes("famous") ||
q3.includes("repetitive")
){
score++;
}

if(
q4.includes("yes") ||
q4.includes("support")
){
score++;
}

document.getElementById("readingScore").innerHTML =
"Reading Score: " + score + " / 4";
}

function generateEssay(){

let topic = document.getElementById("topic").value;
let adv1 = document.getElementById("adv1").value;
let adv2 = document.getElementById("adv2").value;
let disadv = document.getElementById("disadv").value;
let conclusion = document.getElementById("conclusion").value;

let essay =

"INTRODUCTION\n\n" +
topic + " is an important topic nowadays. " +
"In this essay, I will discuss both sides and give my opinion.\n\n" +

"ARGUMENTS FOR\n\n" +
"Firstly, " + adv1 + ".\n\n" +
"In addition, " + adv2 + ".\n\n" +

"ARGUMENTS AGAINST\n\n" +
"On the other hand, some people think that " +
disadv + ".\n\n" +

"CONCLUSION\n\n" +
"To sum up, " + conclusion + ".";

let wordCount = essay.trim().split(/\s+/).length;

let feedback = "<div class='feedback'><h3>Essay Feedback</h3>";

feedback +=
(wordCount >= 100)
? "✅ Word count is above 100 words.<br>"
: "⚠ Try writing more details.<br>";

feedback += "✅ Introduction included.<br>";
feedback += "✅ Arguments for included.<br>";
feedback += "✅ Counterargument included.<br>";
feedback += "✅ Conclusion included.<br>";
feedback += "✅ Linking words used.<br>";

feedback += "<br><strong>Total Words: "
+ wordCount + "</strong></div>";

document.getElementById("essayOutput").innerHTML =
"<div class='generated'><h3>Your Essay</h3>" +
essay +
"</div>" +
feedback;
}

</script>

</body>
</html>
